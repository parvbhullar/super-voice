[project]
name = "supervoice"
version = "0.1.0"
description = "Speech pipeline with text-only Agent Bridge boundary"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[silero,webrtc,deepgram,cartesia,elevenlabs]>=1.2,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "pyrefly>=0.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supervoice"]
include = ["src/supervoice/**/*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
