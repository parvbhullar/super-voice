# Voice profile catalog v1.
#
# WARNING: voice_id values in tts_preference are PLACEHOLDERS.
# Replace with real provider voice IDs before production deployment:
#   - Cartesia: see https://docs.cartesia.ai/get-started/available-voices
#   - ElevenLabs: see https://elevenlabs.io/app/voice-library
# The 4 ids here (hi-female, hi-male, en-female, en-male) define the catalog
# *contract*; the underlying provider voices can be swapped without code changes.
version: 1
profiles:
  - id: hi-female
    language: hi
    persona: warm
    stt_preference:
      - {provider: deepgram, language: hi}
      - {provider: cartesia, language: hi}
    tts_preference:
      - {provider: cartesia, voice_id: sonic-hindi-female}
      - {provider: elevenlabs, voice_id: hi-female-rachel}
  - id: hi-male
    language: hi
    persona: deep
    stt_preference:
      - {provider: deepgram, language: hi}
    tts_preference:
      - {provider: cartesia, voice_id: sonic-hindi-male}
  - id: en-female
    language: en
    persona: warm
    stt_preference:
      - {provider: deepgram, language: en}
    tts_preference:
      - {provider: cartesia, voice_id: sonic-english-female}
      - {provider: elevenlabs, voice_id: rachel}
  - id: en-male
    language: en
    persona: deep
    stt_preference:
      - {provider: deepgram, language: en}
    tts_preference:
      - {provider: cartesia, voice_id: sonic-english-male}
